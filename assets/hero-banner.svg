<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060A" />
      <stop offset="50%" stop-color="#0A0C14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Crimson Glow Filter -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Green Glow Filter -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Diagonal Scan Pattern -->
    <pattern id="scanlines" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="2" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="900" height="260" fill="url(#bg-grad)" rx="8" />

  <!-- Background Grid -->
  <rect width="900" height="260" fill="url(#grid)" rx="8" />

  <!-- Scanlines Overlay -->
  <rect width="900" height="260" fill="url(#scanlines)" rx="8" />

  <!-- HUD Outer Frame & Corner Brackets -->
  <rect x="12" y="12" width="876" height="236" fill="none" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.4" rx="4" />
  
  <!-- Corner Tech Brackets (Crimson & Cyan) -->
  <path d="M 8 30 L 8 8 L 30 8" fill="none" stroke="#FF003C" stroke-width="3" filter="url(#glow-red)" />
  <path d="M 870 8 L 892 8 L 892 30" fill="none" stroke="#FF003C" stroke-width="3" filter="url(#glow-red)" />
  <path d="M 8 230 L 8 252 L 30 252" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow-cyan)" />
  <path d="M 870 252 L 892 252 L 892 230" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow-cyan)" />

  <!-- Top System Header Bar -->
  <path d="M 30 24 L 280 24 L 295 38 L 605 38 L 620 24 L 870 24" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
  <rect x="340" y="16" width="220" height="22" fill="#0A0F1A" stroke="#00F0FF" stroke-width="1" rx="2" />
  <text x="450" y="31" fill="#00F0FF" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle" filter="url(#glow-cyan)">SYS.NODE // AKOS-RED-01</text>

  <!-- Left Tactical Reticle / Radar Graphic -->
  <g transform="translate(90, 135)">
    <!-- Concentric Circles -->
    <circle r="60" fill="none" stroke="#FF003C" stroke-width="1" stroke-opacity="0.3" />
    <circle r="42" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.5" />
    <circle r="24" fill="none" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.8" />
    <circle r="4" fill="#39FF14" filter="url(#glow-green)" />

    <!-- Crosshairs -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" />
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" />
    <path d="M -45 -45 L -35 -45 M 45 -45 L 35 -45 M -45 45 L -35 45 M 45 45 L 35 45" stroke="#FF003C" stroke-width="2" />

    <!-- Sweeping Radar Line -->
    <line x1="0" y1="0" x2="38" y2="-38" stroke="#39FF14" stroke-width="2" filter="url(#glow-green)" />
    
    <!-- Reticle Labels -->
    <text x="-58" y="-48" fill="#FF003C" font-family="monospace" font-size="8" opacity="0.8">SEC: RED</text>
    <text x="25" y="55" fill="#00F0FF" font-family="monospace" font-size="8" opacity="0.8">TARGET: ACTIVE</text>
  </g>

  <!-- Main Center Titles & Operator Info -->
  <!-- Top Classification Tag -->
  <rect x="210" y="58" width="220" height="20" fill="#FF003C" fill-opacity="0.15" stroke="#FF003C" stroke-width="1" rx="2" />
  <text x="220" y="72" fill="#FF003C" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1.5" filter="url(#glow-red)">[ CLASSIFIED // RED TEAM DOSSIER ]</text>

  <!-- Main Operator Name -->
  <text x="210" y="112" fill="#FFFFFF" font-family="'Consolas', 'Segoe UI', monospace" font-size="34" font-weight="900" letter-spacing="3">ADITYA KHAIRE</text>

  <!-- Designation Subtitle -->
  <text x="210" y="136" fill="#00F0FF" font-family="'Consolas', 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="2" filter="url(#glow-cyan)">OFFENSIVE SECURITY OPERATOR // LAB ARCHITECT</text>

  <!-- Decorative Separator Line -->
  <path d="M 210 146 L 680 146" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow-red)" />
  <polygon points="680,143 686,146 680,149" fill="#FF003C" />

  <!-- Specialization Tags Line -->
  <text x="210" y="166" fill="#A0AAB8" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="bold">
    <tspan fill="#FF003C">►</tspan> ACTIVE DIRECTORY LABS   
    <tspan fill="#00F0FF">►</tspan> NETWORK PENTESTING   
    <tspan fill="#39FF14">►</tspan> SYSTEM INTERNALS
  </text>

  <!-- Status Telemetry Badges (Right Box) -->
  <g transform="translate(710, 58)">
    <rect width="160" height="136" fill="#090C16" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" rx="4" />
    <rect width="160" height="22" fill="#00F0FF" fill-opacity="0.1" rx="2" />
    <text x="80" y="15" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TELEMETRY STATUS</text>
    
    <!-- Status Line 1 -->
    <circle cx="15" cy="38" r="4" fill="#39FF14" filter="url(#glow-green)" />
    <text x="26" y="41" fill="#E0E6ED" font-family="monospace" font-size="9.5" font-weight="bold">SYSTEM: ONLINE</text>

    <!-- Status Line 2 -->
    <circle cx="15" cy="60" r="4" fill="#00F0FF" filter="url(#glow-cyan)" />
    <text x="26" y="63" fill="#E0E6ED" font-family="monospace" font-size="9.5" font-weight="bold">CLEARANCE: LEVEL 3</text>

    <!-- Status Line 3 -->
    <circle cx="15" cy="82" r="4" fill="#FF003C" filter="url(#glow-red)" />
    <text x="26" y="85" fill="#E0E6ED" font-family="monospace" font-size="9.5" font-weight="bold">MODE: OFFENSIVE</text>

    <!-- Status Line 4 -->
    <circle cx="15" cy="104" r="4" fill="#FFB000" />
    <text x="26" y="107" fill="#E0E6ED" font-family="monospace" font-size="9.5" font-weight="bold">TARGET: OSCP / AD</text>

    <line x1="10" y1="118" x2="150" y2="118" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <text x="80" y="129" fill="#A855F7" font-family="monospace" font-size="8.5" text-anchor="middle" font-weight="bold">NODE // CODING666LEGEND</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <path d="M 30 236 L 870 236" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
  <text x="30" y="248" fill="#5A6978" font-family="monospace" font-size="9">LOC: /home/operator666/Coding666Legend</text>
  <text x="450" y="248" fill="#FF003C" font-family="monospace" font-size="9" text-anchor="middle" opacity="0.8">HEX: 0x41 0x4B 0x4F 0x53 0x2F 0x2F 0x52 0x45 0x44 0x5F 0x4F 0x50 0x53</text>
  <text x="870" y="248" fill="#5A6978" font-family="monospace" font-size="9" text-anchor="end">BUILD v3.6.0</text>
</svg>
