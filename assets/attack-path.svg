<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070C" />
      <stop offset="100%" stop-color="#090D18" />
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="ap-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00F0FF" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF003C" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#39FF14" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" fill="url(#ap-bg)" rx="6" />
  <rect width="900" height="380" fill="url(#ap-grid)" rx="6" />
  <rect x="8" y="8" width="884" height="364" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.2" rx="4" />

  <!-- Header Bar -->
  <path d="M 20 28 L 380 28 L 395 40 L 880 40" fill="none" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="25" y="22" fill="#FF003C" font-family="'Consolas', monospace" font-size="12" font-weight="bold" letter-spacing="1.5" filter="url(#glow-red)">[ PHASE // OPERATIONAL RED TEAM ATTACK-PATH FLOW ]</text>
  <text x="875" y="22" fill="#00F0FF" font-family="'Consolas', monospace" font-size="10" text-anchor="end" opacity="0.8">FRAMEWORK: MITRE ATT&amp;CK / LOCKHEED CYBER KILL CHAIN</text>

  <!-- TOP ROW NODES -->
  
  <!-- NODE 1: RECON -->
  <g transform="translate(35, 65)">
    <rect width="240" height="110" fill="#0A0E1A" stroke="#00F0FF" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 25 0 L 0 25 Z" fill="#00F0FF" />
    <text x="5" y="14" fill="#05070C" font-family="monospace" font-size="9" font-weight="bold">01</text>
    <text x="35" y="22" fill="#00F0FF" font-family="'Consolas', monospace" font-size="12" font-weight="bold" filter="url(#glow-cyan)">RECON &amp; OSINT</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="50" fill="#A0AAB8" font-family="monospace" font-size="10">• Passive Intel &amp; Domain Recon</text>
    <text x="15" y="68" fill="#A0AAB8" font-family="monospace" font-size="10">• Subdomain Footprinting</text>
    <text x="15" y="86" fill="#A0AAB8" font-family="monospace" font-size="10">• Open Source Intelligence</text>
    <rect x="15" y="94" width="210" height="10" fill="#00F0FF" fill-opacity="0.1" rx="2" />
    <text x="120" y="102" fill="#00F0FF" font-family="monospace" font-size="8" text-anchor="middle">TOOLS: Amass, theHarvester, OSINT</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 275 120 L 320 120" fill="none" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)" />

  <!-- NODE 2: ENUMERATION -->
  <g transform="translate(330, 65)">
    <rect width="240" height="110" fill="#0A0E1A" stroke="#00F0FF" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 25 0 L 0 25 Z" fill="#00F0FF" />
    <text x="5" y="14" fill="#05070C" font-family="monospace" font-size="9" font-weight="bold">02</text>
    <text x="35" y="22" fill="#00F0FF" font-family="'Consolas', monospace" font-size="12" font-weight="bold" filter="url(#glow-cyan)">ENUMERATION</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="50" fill="#A0AAB8" font-family="monospace" font-size="10">• Port &amp; Service Fingerprinting</text>
    <text x="15" y="68" fill="#A0AAB8" font-family="monospace" font-size="10">• Web Content Directory Fuzzing</text>
    <text x="15" y="86" fill="#A0AAB8" font-family="monospace" font-size="10">• Network Range Discovery</text>
    <rect x="15" y="94" width="210" height="10" fill="#00F0FF" fill-opacity="0.1" rx="2" />
    <text x="120" y="102" fill="#00F0FF" font-family="monospace" font-size="8" text-anchor="middle">TOOLS: Nmap, ffuf, Wireshark</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 570 120 L 615 120" fill="none" stroke="#FF003C" stroke-width="2" marker-end="url(#arrow-red)" filter="url(#glow-red)" />

  <!-- NODE 3: INITIAL ACCESS -->
  <g transform="translate(625, 65)">
    <rect width="240" height="110" fill="#140A10" stroke="#FF003C" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 25 0 L 0 25 Z" fill="#FF003C" />
    <text x="5" y="14" fill="#05070C" font-family="monospace" font-size="9" font-weight="bold">03</text>
    <text x="35" y="22" fill="#FF003C" font-family="'Consolas', monospace" font-size="12" font-weight="bold" filter="url(#glow-red)">INITIAL ACCESS</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#FF003C" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="50" fill="#A0AAB8" font-family="monospace" font-size="10">• Web Vulnerability Exploitation</text>
    <text x="15" y="68" fill="#A0AAB8" font-family="monospace" font-size="10">• Credential Abuse / Spraying</text>
    <text x="15" y="86" fill="#A0AAB8" font-family="monospace" font-size="10">• Establishing Initial Shell</text>
    <rect x="15" y="94" width="210" height="10" fill="#FF003C" fill-opacity="0.15" rx="2" />
    <text x="120" y="102" fill="#FF003C" font-family="monospace" font-size="8" text-anchor="middle">TOOLS: Burp Suite, Caido, Netcat</text>
  </g>

  <!-- Connection 3 -> 4 (Downwards curve) -->
  <path d="M 745 175 L 745 220 L 745 220" fill="none" stroke="#FF003C" stroke-width="2" marker-end="url(#arrow-red)" filter="url(#glow-red)" />

  <!-- BOTTOM ROW NODES -->

  <!-- NODE 4: PRIVILEGE ESCALATION -->
  <g transform="translate(625, 230)">
    <rect width="240" height="110" fill="#140A10" stroke="#FF003C" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 25 0 L 0 25 Z" fill="#FF003C" />
    <text x="5" y="14" fill="#05070C" font-family="monospace" font-size="9" font-weight="bold">04</text>
    <text x="35" y="22" fill="#FF003C" font-family="'Consolas', monospace" font-size="12" font-weight="bold" filter="url(#glow-red)">PRIVILEGE ESCALATION</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#FF003C" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="50" fill="#A0AAB8" font-family="monospace" font-size="10">• Local Misconfig Audit</text>
    <text x="15" y="68" fill="#A0AAB8" font-family="monospace" font-size="10">• Kernel / SUID Exploitation</text>
    <text x="15" y="86" fill="#A0AAB8" font-family="monospace" font-size="10">• System Administrator Elevate</text>
    <rect x="15" y="94" width="210" height="10" fill="#FF003C" fill-opacity="0.15" rx="2" />
    <text x="120" y="102" fill="#FF003C" font-family="monospace" font-size="8" text-anchor="middle">TOOLS: LinPEAS, WinPEAS, PowerUp</text>
  </g>

  <!-- Connection 4 -> 5 (Leftwards) -->
  <path d="M 625 285 L 580 285" fill="none" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-cyan)" opacity="0.9" />

  <!-- NODE 5: AD & LATERAL MOVEMENT -->
  <g transform="translate(330, 230)">
    <rect width="240" height="110" fill="#0F0A1A" stroke="#A855F7" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 25 0 L 0 25 Z" fill="#A855F7" />
    <text x="5" y="14" fill="#05070C" font-family="monospace" font-size="9" font-weight="bold">05</text>
    <text x="35" y="22" fill="#A855F7" font-family="'Consolas', monospace" font-size="12" font-weight="bold">AD &amp; LATERAL MOVE</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="50" fill="#A0AAB8" font-family="monospace" font-size="10">• BloodHound Graph Mapping</text>
    <text x="15" y="68" fill="#A0AAB8" font-family="monospace" font-size="10">• Kerberoasting &amp; Ticket Abuse</text>
    <text x="15" y="86" fill="#A0AAB8" font-family="monospace" font-size="10">• Domain Admin Compromise</text>
    <rect x="15" y="94" width="210" height="10" fill="#A855F7" fill-opacity="0.15" rx="2" />
    <text x="120" y="102" fill="#A855F7" font-family="monospace" font-size="8" text-anchor="middle">TOOLS: BloodHound, Impacket, NetExec</text>
  </g>

  <!-- Connection 5 -> 6 (Leftwards to final green node) -->
  <path d="M 330 285 L 285 285" fill="none" stroke="#39FF14" stroke-width="2" marker-end="url(#arrow-green)" filter="url(#glow-green)" />

  <!-- NODE 6: OBJECTIVE & ANALYSIS -->
  <g transform="translate(35, 230)">
    <rect width="240" height="110" fill="#08140A" stroke="#39FF14" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 25 0 L 0 25 Z" fill="#39FF14" />
    <text x="5" y="14" fill="#05070C" font-family="monospace" font-size="9" font-weight="bold">06</text>
    <text x="35" y="22" fill="#39FF14" font-family="'Consolas', monospace" font-size="12" font-weight="bold" filter="url(#glow-green)">OBJECTIVE &amp; REPORT</text>
    <line x1="15" y1="32" x2="225" y2="32" stroke="#39FF14" stroke-opacity="0.3" stroke-width="1" />
    <text x="15" y="50" fill="#A0AAB8" font-family="monospace" font-size="10">• Lab Objective Accomplished</text>
    <text x="15" y="68" fill="#A0AAB8" font-family="monospace" font-size="10">• Root Cause Analysis</text>
    <text x="15" y="86" fill="#A0AAB8" font-family="monospace" font-size="10">• Remediation &amp; Defense Notes</text>
    <rect x="15" y="94" width="210" height="10" fill="#39FF14" fill-opacity="0.15" rx="2" />
    <text x="120" y="102" fill="#39FF14" font-family="monospace" font-size="8" text-anchor="middle">RESULT: Mission Complete &amp; Documented</text>
  </g>

  <!-- Bottom Footer Line -->
  <line x1="35" y1="355" x2="865" y2="355" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
  <text x="450" y="367" fill="#5A6978" font-family="monospace" font-size="9" text-anchor="middle">METHODOLOGY PHILOSOPHY: LEARN ► BUILD ► BREAK ► ANALYZE ► DOCUMENT ► IMPROVE</text>
</svg>
